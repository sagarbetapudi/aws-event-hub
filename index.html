<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration — Get Your QR Ticket</title>
  <style>
    :root {
      --bg: #0f172a;          /* page background */
      --card: #ffffff;        /* form card */
      --text: #0f172a;        /* main text */
      --muted: #64748b;       /* secondary text */
      --accent: #4f46e5;      /* button */
      --accent-hover: #4338ca;
      --success: #16a34a;
      --error: #dc2626;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

    form { display: flex; flex-direction: column; gap: 18px; text-align: left; }

    label { font-size: 0.9rem; font-weight: 600; color: var(--text); display: block; }

    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); background: #fff; }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Loading spinner inside the button */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: -3px;
      margin-right: 8px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status messages */
    #message { display: none; margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 1rem; line-height: 1.4; }
    #message.success { display: block; background: #f0fdf4; color: var(--success); border: 1.5px solid var(--success); }
    #message.error   { display: block; background: #fef2f2; color: var(--error);  border: 1.5px solid var(--error); }
    #message strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>College Event Registration</h1>
    <p class="subtitle">Register below — your QR ticket will be emailed to you.</p>

    <form id="registerForm" novalidate>
      <label>Full name
        <input id="name" type="text" autocomplete="name" placeholder="e.g. Sagar Sharma" required>
      </label>
      <label>Email
        <input id="email" type="email" autocomplete="email" placeholder="you@college.edu" required>
      </label>
      <label>College roll number
        <input id="roll" type="text" placeholder="e.g. 21BCE1234" required>
      </label>
      <button id="submitBtn" type="submit">Get My Ticket</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    
    const API_BASE = "https://api.key.ap-south-1.amazonaws.com";
    const API_FIELDS = { name: "name", email: "email", roll: "roll" };

    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const defaultBtnText = submitBtn.textContent;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const roll = document.getElementById("roll").value.trim();

      if (!name || !email || !roll) {
        showMessage("error", "Please fill in all fields.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Registering…';
      hideMessage();

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            [API_FIELDS.name]: name,
            [API_FIELDS.email]: email,
            [API_FIELDS.roll]: roll,
          }),
        });

        let data = {};
        try { data = await res.json(); } catch (_) {}

        if (res.ok) {
          showMessage("success", "✅ Check your email for your QR ticket");
          form.reset();
        } else {
          const reason = data.reason || data.error || data.message || data.detail || `Registration failed (${res.status})`;
          showMessage("error", reason);
        }
      } catch (err) {
        showMessage("error", "Could not reach the server. Check your connection and try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = defaultBtnText;
      }
    });

    function showMessage(type, text) {
      message.className = type;
      message.textContent = text;
    }
    function hideMessage() {
      message.className = "";
      message.textContent = "";
    }
  </script>
</body>
</html>
